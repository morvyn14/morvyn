<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西港起陣｜台灣第一香藝陣記憶</title>
  <style>
    :root {
      --primary: #7b1d28; /* 深紅色，更有歷史感 */
      --secondary: #1a1a1a;
      --bg: #f4efe6; /* 仿舊宣紙色 */
      --gold: #c5a059; /* 祭典香火金 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", serif;
    }

    body {
      background-color: var(--bg);
      color: var(--secondary);
      line-height: 1.7;
    }

    /* 導覽列 */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(244, 239, 230, 0.95);
      border-bottom: 2px solid var(--gold);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: 2px;
    }

    .nav-links a {
      margin-left: 30px;
      text-decoration: none;
      color: var(--secondary);
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    /* 首頁英雄區 */
    .hero {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('image/4497D34B-A28B-4F6A-8EC5-30C387D48723.jpeg') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 4.5rem;
      letter-spacing: 12px;
      margin-bottom: 10px;
      font-weight: 900;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hero .subtitle {
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: 5px;
      margin-bottom: 30px;
    }

    .hero p {
      max-width: 700px;
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 40px;
    }

    /* 藝陣總覽區 */
    .section-title {
      text-align: center;
      font-size: 2.2rem;
      color: var(--primary);
      margin: 80px 0 40px;
      letter-spacing: 3px;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 3px;
      background: var(--gold);
      margin: 15px auto;
    }

    .array-container {
      max-width: 1100px;
      margin: 0 auto 100px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 40px;
    }

    .array-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: 0.4s;
    }

    /* 只有宋江陣是亮的，其他的加上灰階與半透明 */
    .array-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      transition: 0.5s;
    }

    .array-card.active:hover img {
      transform: scale(1.05);
    }

    .array-card.coming-soon {
      opacity: 0.6;
      filter: grayscale(80%);
      cursor: not-allowed;
    }

    .card-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 30px 20px 20px;
      color: white;
    }

    .card-overlay h3 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: var(--gold);
    }

    .enter-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 20px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .enter-btn:hover {
      background: #5a141d;
    }

    footer {
      background: var(--secondary);
      color: #888;
      text-align: center;
      padding: 40px 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">西港起陣</a>
